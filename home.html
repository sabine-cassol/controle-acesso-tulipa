<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Home - Condomínio Tulipa</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="cabecalho">
  <div class="conteudo">
    <img src="assets/logo.png" alt="Logo do Condomínio" class="logo">
    <h1>Condomínio Tulipa - Controle de Acessos - Portaria</h1>
  </div>

  <nav class="menu">
    <a href="home.html">Início</a>
    <a href="relatorio.html">Relatórios</a>
    <a href="usuarios.html" id="menuUsuarios">Usuários</a>
    <a href="#" onclick="logout()">Sair</a>
  </nav>
</header>

<main class="conteudo">
  <h2>Cadastro de Visitantes</h2>

  <!-- CAMPOS JÁ EXISTENTES (mantidos) -->
  <input type="text" id="nome" placeholder="Nome completo">
  <input type="date" id="nascimento">
  <input type="text" id="cpf" placeholder="CPF">
  <input type="text" id="casa" placeholder="Casa de destino">

  <label>Data e hora de entrada</label>
  <input type="datetime-local" id="entrada" disabled>

  <!-- 🔽 NOVOS CAMPOS DE VEÍCULO 🔽 -->
  <h3>Dados do Veículo</h3>

  <select id="tipoVeiculo">
    <option value="">Tipo do veículo</option>
    <option value="Carro">Carro</option>
    <option value="Motocicleta">Motocicleta</option>
    <option value="Van">Van</option>
    <option value="Caminhão">Caminhão</option>
  </select>

  <input type="text" id="marcaModelo" placeholder="Marca e modelo do veículo">
  <input type="text" id="corVeiculo" placeholder="Cor do veículo">
  <input type="text" id="placaVeiculo" placeholder="Placa do veículo">

  <!-- BOTÃO JÁ EXISTENTE -->
  <button type="button" onclick="salvarVisitante()">Cadastrar</button>
</main>
