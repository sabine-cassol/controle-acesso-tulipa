<!DOCTYPE html>
<html lang="pt-br">

</head>
<body>

<header class="cabecalho">

  </div>

  <nav class="menu">

<main class="conteudo">
  <h2>Cadastro de Visitantes</h2>

  <input type="date" id="nascimento">
  <input type="text" id="cpf" placeholder="CPF">
  <input type="text" id="casa" placeholder="Casa de destino">
 
 <label>Data e hora de entrada</label>
  <input type="datetime-local" id="entrada" disabled>


<button class="btn-principal" onclick="salvarVisitante()">
  Cadastrar Visitante
</button>

</main>
